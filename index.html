<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Playlist Downloader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#121212;
  --text:#fff;
  --card-bg:#242424;
  --card-hover:#2b2b2b;
  --meta:#aaa;
  --accent:#7C4DFF;
}

body[data-theme="light"]{
  --bg:#fdfdfd;
  --text:#222;
  --card-bg:#fff;
  --card-hover:#f0f0f0;
  --meta:#555;
  --accent:#6200ea;
}

body{
  margin:0;
  font-family:'Varela Round',system-ui;
  background:var(--bg);
  color:var(--text);
  transition: background .4s ease, color .4s ease;
}

.container{max-width:900px;margin:auto;padding:20px}

/* ===== Header ===== */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.header-title{
  font-size:2rem;
  font-weight:bold;
  color:var(--accent);
}

.header-sub{
  font-size:.9rem;
  color:var(--meta);
}

/* ===== Controls ===== */
.header-controls{
  display:flex;
  align-items:center;
  gap:14px;
}

.quality-group{
  display:flex;
  gap:8px;
}

.quality-btn{
  background:var(--card-bg);
  border:1px solid #444;
  color:var(--text);
  padding:6px 14px;
  border-radius:20px;
  cursor:pointer;
  transition:.25s;
}

.quality-btn:hover{
  background:var(--card-hover);
}

.quality-btn.active{
  border-color:var(--accent);
  color:var(--accent);
}

/* ===== MODE TOGGLE (UPGRADED) ===== */
#modeToggle{
  width:50px;
  height:50px;
  border-radius:50%;
  border:#dark;
  cursor:pointer;
  background:var(#black);
  color:var(#black);
  font-size:22px;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:
    background .3s ease,
    box-shadow .3s ease,
    transform .4s ease;
}

#modeToggle:hover{
  box-shadow:0 0 12px var(#dark);
  transform:scale(1.08);
}

#modeToggle.animate{
  transform:rotate(360deg) scale(1.15);
}

</style>
</head>

<body>

<div class="container">
  <div class="header">
    <div>
      <div class="header-title">Playlist Downloader</div>
      <div class="header-sub" id="trackCount">No playlist loaded</div>
    </div>

    <div class="header-controls">
      <div class="quality-group">
        <button class="quality-btn active" data-q="320kbps">320</button>
        <button class="quality-btn" data-q="160kbps">160</button>
        <button class="quality-btn" data-q="96kbps">96</button>
      </div>

      <button id="modeToggle" aria-label="Toggle theme">🌙</button>
    </div>
  </div>
</div>

<script>
/* ===== THEME TOGGLE ===== */
const modeToggle = document.getElementById("modeToggle");
const savedTheme = localStorage.getItem("theme") || "dark";

document.body.setAttribute("data-theme", savedTheme);
modeToggle.textContent = savedTheme === "dark" ? "🌞" : "🌙";

modeToggle.addEventListener("click", () => {
  const current = document.body.getAttribute("data-theme");
  const next = current === "dark" ? "light" : "dark";

  document.body.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);

  modeToggle.textContent = next === "dark" ? "🌞" : "🌙";

  // trigger animation
  modeToggle.classList.add("animate");
  setTimeout(() => modeToggle.classList.remove("animate"), 500);
});

/* ===== QUALITY SELECTOR ===== */
let quality = "320kbps";

document.querySelectorAll(".quality-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".quality-btn")
      .forEach(b => b.classList.remove("active"));

    btn.classList.add("active");
    quality = btn.dataset.q;
    console.log("Selected quality:", quality);
  };
});
</script>

</body>
</html>
