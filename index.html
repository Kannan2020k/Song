<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playlist Downloader</title>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  /* ===== Base Styles ===== */
  body {
    font-family: 'Varela Round', system-ui;
    margin: 0;
    background-color: #fff;
    color: #333;
    transition: background-color 0.3s, color 0.3s;
  }

  .container {
    max-width: 900px;
    margin: auto;
    padding: 20px 20px 180px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .header-title { font-size: 2rem; font-weight: bold; color: #7C4DFF; }
  .header-sub { font-size: .9rem; color: #555; margin-top: 5px; }

  .search {
    width: 100%;
    padding: 10px;
    margin: 15px 0;
    border-radius: 25px;
    border: 1px solid #ccc;
    background: #f0f0f0;
    font-size: 1rem;
    color: #333;
  }

  /* ===== Quality Buttons ===== */
  .quality-btn {
    background: #f0f0f0;
    border: 1px solid #ccc;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .quality-btn.active {
    border-color: #7C4DFF;
    color: #7C4DFF;
  }

  /* ===== Cards ===== */
  .card {
    display: flex;
    gap: 12px;
    padding: 12px;
    background: #f9f9f9;
    border-radius: 14px;
    margin-bottom: 12px;
    align-items: center;
    transition: .3s;
    cursor: pointer;
  }
  .card:hover { background: #ececec; }
  .card img { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; }
  .card-info { flex: 1; overflow: hidden; }
  .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold; }
  .meta { font-size: .8rem; color: #777; }
  .actions { display: flex; gap: 10px; }
  .actions span { cursor: pointer; color: #7C4DFF; }

  /* ===== FAB & Download All ===== */
  .fab, .download-all {
    position: fixed;
    right: 20px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(45deg,#7C4DFF,#9a6bff);
    border: none;
    color: #fff;
    font-size: 28px;
    cursor: pointer;
    transition: all 0.3s ease;
    z-index: 1000;
  }
  .fab { bottom: 20px; }
  .download-all { bottom: 90px; display: none; }

  /* ===== Sheet ===== */
  .sheet {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #f0f0f0;
    padding: 25px;
    transform: translateY(100%);
    transition: .3s;
    border-radius: 20px 20px 0 0;
  }
  .sheet.open { transform: translateY(0); }
  .sheet input, .sheet button { width: 100%; padding: 12px; border-radius: 25px; border: none; margin-bottom: 10px; }

  /* ===== Audio Player ===== */
  audio { display: none; }

  /* ===== Dark Mode ===== */
  body[data-theme="dark"] {
    background-color: #121212;
    color: #ccc;
  }
  body[data-theme="dark"] .container { background: #121212; }
  body[data-theme="dark"] .header-title { color: #fff; }
  body[data-theme="dark"] .header-sub { color: #aaa; }
  body[data-theme="dark"] .search { background: #242424; color: #fff; border: 1px solid #555; }
  body[data-theme="dark"] .card { background: #242424; }
  body[data-theme="dark"] .card:hover { background: #2b2b2b; }
  body[data-theme="dark"] .sheet { background: #242424; color: #fff; }
  body[data-theme="dark"] .quality-btn { background: #333; border: 1px solid #555; color: #ccc; }
  body[data-theme="dark"] .quality-btn.active { color: #7C4DFF; border-color: #7C4DFF; }

  /* ===== Dark Mode Button ===== */
  #modeToggle {
    position: fixed;
    top: 20px;
    right: 90px; /* Slightly left of FAB */
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background-color: #fff;
    font-size: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    z-index: 1001;
    transition: all 0.3s ease;
  }
  body[data-theme="dark"] #modeToggle { background-color: #333; color: #fff; }

  /* ===== Loader ===== */
  .loader {
    display: none;
    margin: 20px auto;
    width: 40px;
    height: 40px;
    border: 4px solid #ccc;
    border-top: 4px solid #7C4DFF;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { 0% {transform: rotate(0deg);} 100% {transform: rotate(360deg);} }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <div class="header-title">Playlist Downloader</div>
      <div class="header-sub" id="trackCount">No playlist loaded</div>
    </div>
    <div>
      <button class="quality-btn active" data-q="320kbps">320</button>
      <button class="quality-btn" data-q="160kbps">160</button>
      <button class="quality-btn" data-q="96kbps">96</button>
    </div>
  </div>

  <input class="search" id="search" placeholder="Search by song title">
  <div class="loader" id="loader"></div>
  <div id="tracks"></div>
</div>

<button class="download-all" id="downloadAll">⬇</button>
<button id="modeToggle">🌙</button>
<button class="fab" id="fab">+</button>

<div class="sheet" id="sheet">
  <input id="playlistUrl" placeholder="Spotify playlist URL">
  <button id="loadBtn">Load Playlist</button>
</div>

<audio id="player"></audio>

<script>
const SPOTIFY_API="https://spotify-api-6yog.vercel.app/api/scrape";
const SAAVN_API="https://jiosavan-api-with-playlist.vercel.app/api/search/songs";

const tracksDiv = document.getElementById("tracks");
const loader = document.getElementById("loader");
const player = document.getElementById("player");
const searchInput = document.getElementById("search");
const downloadAllBtn = document.getElementById("downloadAll");
const sheet = document.getElementById("sheet");
const fab = document.getElementById("fab");
const modeToggle = document.getElementById("modeToggle");

let quality="320kbps", saavnCache={}, currentKey=null,currentBtn=null,currentCard=null;

// === Dark Mode Toggle ===
let theme = localStorage.getItem("theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light");
document.body.setAttribute("data-theme", theme);
modeToggle.textContent = theme==="dark"?"🌞":"🌙";
modeToggle.onclick = ()=>{
  theme = document.body.getAttribute("data-theme")==="dark"?"light":"dark";
  document.body.setAttribute("data-theme", theme);
  localStorage.setItem("theme", theme);
  modeToggle.textContent = theme==="dark"?"🌞":"🌙";
}

// === Quality Buttons ===
document.querySelectorAll(".quality-btn").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".quality-btn").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    quality=b.dataset.q;
  };
});

// === FAB open sheet ===
fab.onclick = ()=>sheet.classList.add("open");

// === Playlist ID parser ===
function getPlaylistId(url){
  try{
    const u=new URL(url);
    const parts=u.pathname.split('/');
    const idx=parts.indexOf('playlist');
    if(idx!==-1 && parts[idx+1]) return parts[idx+1];
    return null;
  }catch{return null;}
}

// === Highlight search term ===
function highlight(text, term){ 
  if(!term) return text;
  const re=new RegExp(`(${term})`,"gi");
  return text.replace(re,"<mark>$1</mark>");
}

// === Prefetch Saavn Data ===
async function prefetch(key){
  if(saavnCache[key]) return;
  try{
    const res = await fetch(`${SAAVN_API}?query=${encodeURIComponent(key)}&limit=1`);
    const j = await res.json();
    saavnCache[key] = j?.data?.results?.[0]?.downloadUrl||[];
  }catch{ saavnCache[key]=[]; }
}

// === Get best quality URL ===
function getBest(urls){ return urls?.find(u=>u.quality===quality)||urls?.[0]; }

// === Load Playlist ===
document.getElementById("loadBtn").onclick=async()=>{
  const url=document.getElementById("playlistUrl").value.trim();
  const id=getPlaylistId(url);
  if(!id){ alert("Invalid playlist URL"); return; }
  sheet.classList.remove("open");
  loader.style.display="block";
  tracksDiv.innerHTML="";

  try{
    const res=await fetch(`${SPOTIFY_API}?playlist=${id}`);
    const j=await res.json();
    if(!j.tracks?.length) throw new Error("No tracks found");
    document.getElementById("trackCount").textContent=j.tracks.length+" tracks";

    for(const t of j.tracks){
      const key=`${t.title} ${t.artists}`;
      await prefetch(key);

      const c=document.createElement("div");
      c.className="card";
      c.dataset.search=t.title.toLowerCase();
      c.innerHTML=`<img src="${t.image}">
      <div class="card-info">
        <div class="title">${t.title}</div>
        <div class="meta">${t.artists}</div>
      </div>
      <div class="actions">
        <span class="material-icons play">play_arrow</span>
        <span class="material-icons down">download</span>
      </div>`;
      tracksDiv.appendChild(c);

      // Play button
      c.querySelector(".play").onclick=()=>{
        const best=getBest(saavnCache[key]); if(!best) return;
        if(currentKey===key){
          player.paused ? player.play() : player.pause();
          c.querySelector(".play").textContent=player.paused?"play_arrow":"pause";
          return;
        }
        if(currentBtn) currentBtn.textContent="play_arrow";
        if(currentCard) currentCard.classList.remove("playing");
        player.src=best.url;
        player.play();
        c.querySelector(".play").textContent="pause";
        c.classList.add("playing");
        currentKey=key; currentBtn=c.querySelector(".play"); currentCard=c;
      };

      // Download button
      c.querySelector(".down").onclick=async()=>{
        const best=getBest(saavnCache[key]); if(!best) return;
        const blob = await (await fetch(best.url)).blob();
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${key.replace(/[<>:"/\\|?*]/g,"_")}.m4a`;
        a.click();
      };
    }
    downloadAllBtn.style.display="block";
  }catch(e){ alert("Error loading playlist: "+e.message); }
  loader.style.display="none";
};

// === Audio ended ===
player.onended = ()=>{ if(currentBtn) currentBtn.textContent="play_arrow"; if(currentCard) currentCard.classList.remove("playing"); currentKey=null; currentBtn=null; currentCard=null; };

// === Search Tracks ===
searchInput.oninput = e=>{
  const q = e.target.value.toLowerCase().trim();
  document.querySelectorAll(".card").forEach(c=>{
    const title=c.querySelector(".title").textContent;
    if(title.toLowerCase().includes(q)){
      c.style.display="flex";
      c.querySelector(".title").innerHTML=highlight(title,q);
    }else c.style.display="none";
  });
};

// === Download All ===
downloadAllBtn.onclick=async()=>{
  const entries=Object.entries(saavnCache);
  for(let i=0;i<entries.length;i++){
    const [k,u]=entries[i]; const best=getBest(u); if(!best) continue;
    const blob = await (await fetch(best.url)).blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${k.replace(/[<>:"/\\|?*]/g,"_")}.m4a`;
    a.click();
    await new Promise(r=>setTimeout(r,500));
  }
};
</script>
</body>
</html>
