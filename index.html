<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tamil Music Player</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Roboto',sans-serif;
  background:#0f0f0f;
  color:#fff;
}

/* HEADER */
.header{
  background:#212121;
  padding:16px;
  position:sticky;
  top:0;
  z-index:100;
  border-bottom:1px solid #303030;
}
.header-content{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:20px;
}
.logo{display:flex;align-items:center;gap:10px;font-size:20px}
.logo-icon{
  width:32px;height:32px;background:#ff0000;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.search-container{flex:1;max-width:600px}
.search-box{
  display:flex;
  border:1px solid #303030;
  border-radius:25px;
  overflow:hidden;
}
.search-input{
  flex:1;
  padding:10px 15px;
  border:none;
  background:#121212;
  color:#fff;
  outline:none;
}
.search-btn{
  background:#303030;
  border:none;
  padding:10px 15px;
  cursor:pointer;
  color:#fff;
}

/* MAIN */
.main{
  max-width:1200px;
  margin:auto;
  padding:20px;
  padding-bottom:120px;
}
.music-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:15px;
}
.song-card{
  cursor:pointer;
}
.song-card img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:8px;
}
.song-info{padding:5px}
.song-title{font-size:14px}
.song-artist{font-size:12px;color:#aaa}

/* PLAYER BAR */
.player{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#212121;
  border-top:1px solid #303030;
  padding:10px;
}
.player-content{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 2fr 1fr;
  align-items:center;
}
.player-info{display:flex;gap:10px;align-items:center}
.player-info img{
  width:50px;height:50px;border-radius:5px;
}
.controls{
  display:flex;
  flex-direction:column;
  align-items:center;
}
.control-buttons{
  display:flex;gap:10px;
}
.control-btn{
  background:none;border:none;color:#fff;
  cursor:pointer;font-size:22px;
}
.play-btn{
  background:#fff;color:#000;
  border-radius:50%;
  width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;
}
.progress{
  display:flex;
  align-items:center;
  gap:5px;
  width:100%;
}
.progress input{
  flex:1;
}

/* MOBILE */
@media(max-width:768px){
  .search-container{display:none}
  .music-grid{
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  }
  .player-content{
    grid-template-columns:1fr;
    gap:10px;
  }
}
</style>
</head>

<body>

<div class="header">
  <div class="header-content">
    <div class="logo">
      <div class="logo-icon">
        <i class="material-icons">music_note</i>
      </div>
      Tamil Music
    </div>
    <div class="search-container">
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Search Tamil songs">
        <button class="search-btn" id="searchBtn">
          <i class="material-icons">search</i>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="main">
  <div class="music-grid" id="musicGrid"></div>
</div>

<div class="player">
  <div class="player-content">
    <div class="player-info">
      <img id="thumb" src="">
      <div>
        <div id="title">Select a song</div>
        <div id="artist" style="color:#aaa;font-size:12px">---</div>
      </div>
    </div>

    <div class="controls">
      <div class="control-buttons">
        <button class="control-btn" id="prev"><i class="material-icons">skip_previous</i></button>
        <button class="control-btn play-btn" id="play"><i class="material-icons">play_arrow</i></button>
        <button class="control-btn" id="next"><i class="material-icons">skip_next</i></button>
      </div>
      <div class="progress">
        <span id="current">0:00</span>
        <input type="range" id="progressBar" value="0" min="0" max="100">
        <span id="duration">0:00</span>
      </div>
    </div>

    <div></div>
  </div>
</div>

<script>
const api = "https://jiosavan-api-with-playlist.vercel.app/api/search/songs?query=Tamil Hits&limit=20";
const audio = new Audio();
let songs = [];
let currentIndex = -1;
let playing = false;

const grid = document.getElementById("musicGrid");
const playBtn = document.getElementById("play");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const thumb = document.getElementById("thumb");
const title = document.getElementById("title");
const artist = document.getElementById("artist");
const progressBar = document.getElementById("progressBar");
const current = document.getElementById("current");
const duration = document.getElementById("duration");

async function loadSongs(){
  const res = await fetch(api);
  const data = await res.json();
  songs = data.data.results;
  songs.forEach((song,i)=>{
    if(!song.downloadUrl) return;
    const div = document.createElement("div");
    div.className="song-card";
    div.innerHTML=`
      <img src="${song.image[2].url}">
      <div class="song-info">
        <div class="song-title">${song.name}</div>
        <div class="song-artist">${song.artists.primary.map(a=>a.name).join(", ")}</div>
      </div>
    `;
    div.onclick=()=>playSong(i);
    grid.appendChild(div);
  });
}

function playSong(i){
  currentIndex=i;
  const song=songs[i];
  audio.src=song.downloadUrl[4].url;
  audio.play();
  playing=true;
  playBtn.innerHTML='<i class="material-icons">pause</i>';
  thumb.src=song.image[2].url;
  title.textContent=song.name;
  artist.textContent=song.artists.primary.map(a=>a.name).join(", ");
}

playBtn.onclick=()=>{
  if(!audio.src) return;
  if(playing){audio.pause();playBtn.innerHTML='<i class="material-icons">play_arrow</i>';}
  else{audio.play();playBtn.innerHTML='<i class="material-icons">pause</i>';}
  playing=!playing;
}

prevBtn.onclick=()=>{if(currentIndex>0)playSong(currentIndex-1)}
nextBtn.onclick=()=>{if(currentIndex<songs.length-1)playSong(currentIndex+1)}

audio.ontimeupdate=()=>{
  progressBar.value=(audio.currentTime/audio.duration)*100||0;
  current.textContent=format(audio.currentTime);
  duration.textContent=format(audio.duration);
}

progressBar.oninput=()=>{
  audio.currentTime=(progressBar.value/100)*audio.duration;
}

function format(t){
  if(!t) return "0:00";
  const m=Math.floor(t/60);
  const s=Math.floor(t%60);
  return m+":"+(s<10?"0"+s:s);
}

loadSongs();
</script>

</body>
</html>
