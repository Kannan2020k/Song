<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playlist Downloader</title>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  /* ===== Base Styles ===== */
  body {
    font-family: 'Varela Round', system-ui;
    margin: 0;
    background-color: #fff;
    color: #333;
    transition: background-color 0.3s, color 0.3s;
  }
  .container {
    max-width: 900px;
    margin: auto;
    padding: 20px 20px 180px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .header-title { font-size: 2rem; font-weight: bold; color: #7C4DFF; }
  .header-sub { font-size: .9rem; color: #555; margin-top: 5px; }
  .search {
    width: 100%;
    padding: 10px;
    margin: 15px 0;
    border-radius: 25px;
    border: 1px solid #ccc;
    background: #f0f0f0;
    font-size: 1rem;
    color: #333;
  }

  /* ===== Quality Buttons Container ===== */
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .quality-btns {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .quality-btn {
    background: #f0f0f0;
    border: 1px solid #ccc;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .quality-btn.active {
    border-color: #7C4DFF;
    color: #7C4DFF;
  }

  /* ===== Cards ===== */
  .card {
    display: flex;
    gap: 12px;
    padding: 12px;
    background: #f9f9f9;
    border-radius: 14px;
    margin-bottom: 12px;
    align-items: center;
    transition: .3s;
    cursor: pointer;
  }
  .card:hover { background: #ececec; }
  .card img { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; }
  .card-info { flex: 1; overflow: hidden; }
  .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold; }
  .meta { font-size: .8rem; color: #777; }
  .actions { display: flex; gap: 10px; }
  .actions span { cursor: pointer; color: #7C4DFF; }

  /* ===== Floating Buttons ===== */
  .fab, .download-all {
    position: fixed;
    right: 20px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(45deg,#7C4DFF,#9a6bff);
    border: none;
    color: #fff;
    font-size: 28px;
    cursor: pointer;
    transition: all 0.3s ease;
    z-index: 1000;
  }
  .fab { bottom: 20px; }
  .download-all { bottom: 90px; display: none; }

  /* ===== Dark Mode Button ===== */
  #modeToggle {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background-color: #fff;
    font-size: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    transition: all 0.3s ease;
  }

  /* ===== Sheet ===== */
  .sheet {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #f0f0f0;
    padding: 25px;
    transform: translateY(100%);
    transition: .3s;
    border-radius: 20px 20px 0 0;
  }
  .sheet.open { transform: translateY(0); }
  .sheet input, .sheet button { width: 100%; padding: 12px; border-radius: 25px; border: none; margin-bottom: 10px; }

  /* ===== Audio Player ===== */
  audio { display: none; }

  /* ===== Loader ===== */
  .loader {
    display: none;
    margin: 20px auto;
    width: 40px;
    height: 40px;
    border: 4px solid #ccc;
    border-top: 4px solid #7C4DFF;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { 0% {transform: rotate(0deg);} 100% {transform: rotate(360deg);} }

  /* ===== Dark Mode Styles ===== */
  body[data-theme="dark"] {
    background-color: #121212;
    color: #ccc;
  }
  body[data-theme="dark"] .container { background: #121212; }
  body[data-theme="dark"] .header-title { color: #fff; }
  body[data-theme="dark"] .header-sub { color: #aaa; }
  body[data-theme="dark"] .search { background: #242424; color: #fff; border: 1px solid #555; }
  body[data-theme="dark"] .card { background: #242424; }
  body[data-theme="dark"] .card:hover { background: #2b2b2b; }
  body[data-theme="dark"] .sheet { background: #242424; color: #fff; }
  body[data-theme="dark"] .quality-btn { background: #333; border: 1px solid #555; color: #ccc; }
  body[data-theme="dark"] .quality-btn.active { color: #7C4DFF; border-color: #7C4DFF; }
  body[data-theme="dark"] #modeToggle { background-color: #333; color: #fff; }

</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <div class="header-title">Playlist Downloader</div>
      <div class="header-sub" id="trackCount">No playlist loaded</div>
    </div>
    <!-- Controls Container: Quality buttons + Dark Mode -->
    <div class="controls">
      <div class="quality-btns">
        <button class="quality-btn active" data-q="320kbps">320</button>
        <button class="quality-btn" data-q="160kbps">160</button>
        <button class="quality-btn" data-q="96kbps">96</button>
      </div>
      <button id="modeToggle">🌙</button>
    </div>
  </div>

  <input class="search" id="search" placeholder="Search by song title">
  <div class="loader" id="loader"></div>
  <div id="tracks"></div>
</div>

<button class="download-all" id="downloadAll">⬇</button>
<button class="fab" id="fab">+</button>

<div class="sheet" id="sheet">
  <input id="playlistUrl" placeholder="Spotify playlist URL">
  <button id="loadBtn">Load Playlist</button>
</div>

<audio id="player"></audio>

<script>
const SPOTIFY_API="https://spotify-api-6yog.vercel.app/api/scrape";
const SAAVN_API="https://jiosavan-api-with-playlist.vercel.app/api/search/songs";

const tracksDiv=document.getElementById("tracks");
const loader=document.getElementById("loader");
const player=document.getElementById("player");
const searchInput=document.getElementById("search");
const downloadAllBtn=document.getElementById("downloadAll");
const sheet=document.getElementById("sheet");
const fab=document.getElementById("fab");
const modeToggle=document.getElementById("modeToggle");

let quality="320kbps", saavnCache={}, currentKey=null,currentBtn=null,currentCard=null;

// === Dark Mode Toggle ===
let theme = localStorage.getItem("theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light");
document.body.setAttribute("data-theme", theme);
modeToggle.textContent = theme==="dark"?"🌞":"🌙";
modeToggle.onclick = ()=>{
  theme = document.body.getAttribute("data-theme")==="dark"?"light":"dark";
  document.body.setAttribute("data-theme", theme);
  localStorage.setItem("theme", theme);
  modeToggle.textContent = theme==="dark"?"🌞":"🌙";
}

// === Quality Buttons ===
document.querySelectorAll(".quality-btn").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".quality-btn").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    quality=b.dataset.q;
  };
});

// === FAB open sheet ===
fab.onclick = ()=>sheet.classList.add("open");
</script>
</body>
</html>
